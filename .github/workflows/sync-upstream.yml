name: Sync Upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: V3/develop
          fetch-depth: 0

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/Cog-Creators/Red-DiscordBot.git
          git fetch upstream V3/develop
          git merge upstream/V3/develop --no-edit
          git push
